<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lyle Pixton Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style id="css">
/* Layout: corporate ledger &#8212; sticky top nav, full-width bands with a 1120px inner column; case studies open as their own views with a sticky table of contents. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#142033; --muted:#566275; --line:#D8DEE6;
  --accent:#1F3A5F; --on-accent:#FFFFFF; --accent-soft:#E7EDF5;
  --ind:#2C6A4D; --ind-soft:#E2F0E8;
  --todo-bg:#FFF2CC; --todo-ink:#6E4B00; --todo-line:#C9971C;
  --f-display:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151F; --surface:#151F2C; --ink:#E5E9EF; --muted:#9AA6B5; --line:#2A3647;
  --accent:#93B3DB; --on-accent:#0E151F; --accent-soft:#1B293B;
  --ind:#8CCBA8; --ind-soft:#16302A;
  --todo-bg:#3A2E10; --todo-ink:#F3D58C; --todo-line:#9C7A2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151F; --surface:#151F2C; --ink:#E5E9EF; --muted:#9AA6B5; --line:#2A3647;
  --accent:#93B3DB; --on-accent:#0E151F; --accent-soft:#1B293B;
  --ind:#8CCBA8; --ind-soft:#16302A;
  --todo-bg:#3A2E10; --todo-ink:#F3D58C; --todo-line:#9C7A2A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:76px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,4.6vw,3.2rem);letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3vw,2.1rem)}
h3{font-size:1.1rem;font-weight:600;margin:0;line-height:1.35;text-wrap:balance}
h4{font-size:.95rem;font-weight:600;margin:0}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
li+li{margin-top:.3em}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.125rem;color:var(--muted);max-width:66ch}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.vision-text{font-family:var(--f-display);font-size:1.25rem;line-height:1.4}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.prose{max-width:70ch;display:flex;flex-direction:column;gap:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:60px}
.brand{font-family:var(--f-display);font-weight:600;font-size:1.1rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:.9rem;margin-left:8px}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:.9rem;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:4px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--accent-soft)}
@media (max-width:720px){.brand span{display:none}.top .wrap{gap:12px}}

/* bands */
.band{padding-block:72px;border-top:1px solid var(--line)}
.band.alt{background:var(--surface)}
.band-head{display:flex;flex-direction:column;gap:10px;margin-bottom:36px}

/* hero */
.hero{padding-block:64px 56px;background:var(--surface)}
.about-intro{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;align-items:start}
.about-photo{min-width:0}
.headshot{display:block;width:100%;aspect-ratio:466/520;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
@media (max-width:720px){.about-intro{grid-template-columns:1fr;gap:20px}.about-photo{width:160px}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}
.hero-copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 .95rem var(--f-body);padding:10px 18px;border-radius:4px;border:1px solid var(--accent);text-decoration:none;cursor:pointer;background:transparent;color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}
.monogram{aspect-ratio:1;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 3.2rem var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;margin-top:48px;background:var(--bg)}
.stats>div{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.stats>div:first-child{border-left:0}
.stat-n{font:600 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat-l{font-size:.875rem;color:var(--muted);margin-top:4px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats>div:nth-child(3){border-left:0}.stats>div:nth-child(n+3){border-top:1px solid var(--line)}}

.legend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:20px;font-size:.875rem;color:var(--muted)}

/* tags */
.tag{display:inline-block;font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap}
.tag.pro{background:var(--accent-soft);color:var(--accent)}
.tag.ind{background:var(--ind-soft);color:var(--ind)}
.tag.ill{border:1px solid var(--line);color:var(--muted)}

/* grids & cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-2{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.alt .card{background:var(--bg)}
.card ul{font-size:.95rem}
.card p{font-size:.95rem}
.card .eyebrow{margin-bottom:-2px}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--accent);margin-top:8px}
.timeline>div{padding:18px 20px 0 0;position:relative;min-width:0}
.timeline>div::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.timeline .yr{font:500 .8rem var(--f-mono);color:var(--muted);margin-top:6px}
.timeline p{font-size:.95rem;margin-top:8px}
@media (max-width:720px){.timeline{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--accent);padding-left:18px;gap:22px}.timeline>div{padding:0}.timeline>div::before{left:-26px;top:4px}}

/* case cards */
.case-card{padding:0;overflow:hidden}
.grid.cases{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.case-card .cc-body{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1}
.case-card .cc-foot{border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.case-card h3{font-family:var(--f-display);font-size:1.35rem;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.875rem}
.kv dt{color:var(--muted);font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0}
.link-arrow{font-weight:600;text-decoration:none}
.link-arrow:hover{text-decoration:underline}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.alt .tbl{background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--accent-soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.score{font-weight:600;color:var(--accent)}
.tbl-note{font-size:.8rem;color:var(--muted);margin-top:8px}

/* roadmap */
.built{columns:3 200px;column-gap:32px;font-size:.95rem}
.built li{break-inside:avoid}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.roadmap{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.roadmap{grid-template-columns:1fr}}
.rm-col{border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.alt .rm-col{background:var(--bg)}
.rm-col h4{font-family:var(--f-mono);font-weight:500;font-size:.8rem;letter-spacing:.06em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:6px 6px 0 0}
.rm-col ul{list-style:none;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.rm-col li{margin:0;padding-left:10px;border-left:2px solid var(--line)}

/* flow */
.flow{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px;counter-reset:f}
.flow li{margin:0;counter-increment:f;display:flex;align-items:center;gap:10px;font-size:.9rem}
.flow li span{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px}
.flow li span::before{content:counter(f) ". ";font-family:var(--f-mono);color:var(--muted)}
.flow li+li::before{content:"\2192";color:var(--muted)}

/* story card */
.story{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:12px;max-width:820px}
.alt .story{background:var(--bg)}
.story code,.prompt{font-family:var(--f-mono);font-size:.85rem}
.gwt{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem}
.gwt b{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);padding-top:2px}
.prompt{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:16px;white-space:pre-wrap;overflow-x:auto;line-height:1.55}
.alt .prompt{background:var(--surface)}

/* decision box */
.decision{border:1px solid var(--accent);border-radius:6px;padding:20px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}

/* placeholders */
.todo{background:var(--todo-bg);color:var(--todo-ink);border-bottom:1px dashed var(--todo-line);padding:0 4px;border-radius:2px}

/* case study view */
.case-hero{background:var(--surface);padding-block:44px 40px;border-bottom:1px solid var(--line)}
.back{display:inline-block;font-size:.9rem;text-decoration:none;margin-bottom:18px}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:6px;margin-top:28px;background:var(--bg)}
.meta>div{padding:14px 16px;border-left:1px solid var(--line);font-size:.92rem;min-width:0}
.meta>div:first-child{border-left:0}
@media (max-width:820px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.meta>div:nth-child(3){border-left:0}.meta>div:nth-child(n+3){border-top:1px solid var(--line)}}
.tldr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
@media (max-width:820px){.tldr{grid-template-columns:1fr}}
.case-body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;padding-block:48px 80px}
.toc{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:.875rem}
.toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--ink);border-left-color:var(--accent)}
@media (max-width:900px){.case-body{grid-template-columns:1fr}.toc{display:none}}
.cs-sec{display:flex;flex-direction:column;gap:16px;padding-bottom:44px;margin-bottom:44px;border-bottom:1px solid var(--line);min-width:0}
.cs-sec:last-child{border-bottom:0}
.cs-sec h2{font-size:1.55rem}
.cs-sec>.eyebrow{margin-bottom:-8px}

/* contact */
.contact-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.addr{font:500 1.05rem var(--f-mono);user-select:all;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
footer{padding-block:28px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}

/* galleries */
.gallery{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.gallery:empty{display:none}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gallery img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--bg);cursor:zoom-in}
.gallery.one{grid-template-columns:1fr}
.gallery.shots{grid-template-columns:1fr}
.gallery.shots img{aspect-ratio:auto;object-fit:contain;max-height:520px;background:#fff}
.gallery.one img{aspect-ratio:466/520;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.gallery.one figure{border:0;background:transparent}
.gallery figcaption{font-size:.85rem;color:var(--muted);padding:10px 12px;min-height:1em}
.gallery.one figcaption{display:none}
.pdf{display:flex;align-items:center;gap:10px;padding:18px;font-weight:600;text-decoration:none;aspect-ratio:16/10}
.g-ctrl{display:flex;gap:6px;padding:0 10px 10px}
.g-ctrl button,.add-tile{font:500 .8rem var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;padding:4px 8px;cursor:pointer}
.add-tile{border:1.5px dashed var(--todo-line);background:var(--todo-bg);color:var(--todo-ink);min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:.9rem;border-radius:6px}
.gallery.one .add-tile{min-height:0;margin-top:8px}
.gal-label{display:none}
.editing .gal-label{display:block;font:500 .75rem var(--f-mono);color:var(--todo-ink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

/* edit mode */
.editing [data-k]{outline:1px dashed var(--line);outline-offset:4px;border-radius:2px;cursor:text}
.editing [data-k]:hover{outline-color:var(--todo-line)}
.editing [data-k]:focus{outline:2px solid var(--accent)}
.editing figcaption[contenteditable]{outline:1px dashed var(--line)}
.editbar{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.editbar .btn{background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.editbar .btn.primary{background:var(--accent)}
.edit-status{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:.85rem;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.edit-banner{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:19;background:var(--todo-bg);color:var(--todo-ink);border-bottom:1px solid var(--todo-line);font-size:.875rem}
.edit-banner .wrap{padding-block:8px}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(8,12,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;cursor:zoom-out}
.lightbox img{max-height:84vh;max-width:100%;border-radius:4px}
.lightbox p{color:#E5E9EF;font-size:.9rem;max-width:70ch;text-align:center}
</style>

      <div class="prose" data-k="about-summary">
        <p>I spent my first years in this industry on the phone with dealership controllers and office managers, solving the problems that kept them from closing the month. That work taught me how users really behave, what they need, and how they react to change. It now shapes every epic, user story and roadmap decision I make.</p>
        <p>Today I'm the product owner for a dealer management system's ERP accounting, payroll, API and reporting products. I've supported and enhanced the legacy system and now lead the ground-up build of its modern replacement. I work with developers at the detail level, from backlog grooming to acceptance criteria, while keeping the product vision in view.</p>
      </div>
      </div>

      <div>
        <div class="eyebrow" style="margin-bottom:14px">Career path &#183; enterprise automotive software company</div>
        <div class="timeline">
          <div><h3 data-k="tl1t">Lead Technical Client Service Specialist</h3><div class="yr">2015 &#8211; 2019</div><p data-k="tl1p">Led a 40+ person accounting and payroll support team through escalations. Used support analytics and call reviews to find and fix top call drivers, ran weekly team trainings, and taught yearly controller conference sessions on bank reconciliation, schedule setup and month-end close best practices. Supported new installs and post-install adoption. Learned what clients value most, how they respond to change and what drives acceptance of new features, and built lasting relationships with dealership owners and controllers nationwide.</p></div>
          <div><h3 data-k="tl2t">Accounting, Payroll &amp; OEM Reporting Product Specialist</h3><div class="yr">2019 &#8211; 2024</div><p data-k="tl2p">Subject matter expert for accounting, payroll and reporting. Built SQL troubleshooting tools adopted across the entire support organization, cutting investigation time from hours to minutes. Partnered with OEMs on factory financial statements, worked with third-party vendors on APIs, and ran QA every sprint. Helped product prioritize the backlog and plan each sprint. Owned the customer-facing feedback portal where users submitted and voted on enhancement requests, and brought the top requests to product leadership to start discovery. Learned the value of listening closely to customers and getting the right stakeholders in the room to solve problems.</p></div>
          <div><h3 data-k="tl3t">Product Owner &amp; Creator</h3><div class="yr">2024 &#8211; present</div><p data-k="tl3p">Own the DMS accounting, payroll, API and reporting products. Lead the ground-up rebuild of the legacy accounting system and direct priorities for 2 development teams. Grew the role into a hybrid product owner and product manager position, titled Product Creator. Led discovery end to end and delivered major improvements over the legacy system, piloted by 4 dealer groups. At a pivotal point in the company's direction, initiated a change in approach that avoided significant costs in development, data conversion and training, and protected customer satisfaction.</p></div>
        </div>
      </div>

<!-- DISCOVERY -->
<section class="band" id="discovery">
  <div class="wrap">
    <div class="band-head">
      <div class="eyebrow">Product discovery &amp; validation</div>
      <h2>How I find and validate problems before we build</h2>
      <p class="lede" data-k="disc-lede">Years of support work gave me a habit: start from evidence of real user pain, then test the smallest thing that proves or disproves the idea.</p>
    </div>
    <div class="stack-lg">
      <div class="grid">
        <div class="card"><h3>User interviews</h3><div data-k="d1"><p>I talk directly with the people who use the product and with the client-facing teams who hear from them daily. For the accounting rebuild I interviewed about 10 controllers, office managers and accountants through calls and user conference sessions, and used what I heard to set backlog priorities around what users expected.</p></div></div>
        <div class="card"><h3>Customer feedback analysis</h3><div data-k="d2"><p>I analyzed call management and case data to find top call drivers, then fixed the root causes. This cut call volume by 5+ calls per day and turned reconciliation research from hours into minutes.</p><p>I also owned the customer-facing feedback portal, which held hundreds of enhancement requests and took in about 10 new ones each week. Users voted on each other's ideas. I reviewed and grouped them by theme, then brought the most-requested ones to product leadership to start discovery.</p></div></div>
        <div class="card"><h3>Jobs To Be Done</h3><div data-k="d3"><p><i>"When I close the month, I want every subledger to tie to the general ledger, so I can sign off on financials without hours of manual research."</i></p><p class="muted small">Example job from the controller persona.</p></div></div>
        <div class="card"><h3>Problem validation</h3><div data-k="d4"><p>Before a problem goes on the roadmap I check three sources: support case volume, usage data in Pendo, and feedback from key stakeholders. When those agree, it's a real problem.</p><p>The same habit works on our own plans. Before a universal ledger was rolled out to every dealer, I tested it against real conversion and reporting needs and found it would fail. See <a href="#case-pivot">Changing course</a>.</p></div></div>
        <div class="card"><h3>Hypothesis development</h3><div data-k="d5"><p><i>We believe that</i> a modern accounting platform with intercompany accounting built for large dealer groups <i>will</i> open the door to dealer groups of any size across the US, a market the legacy system couldn't serve.</p><p><i>We'll know we're right when</i> dealer groups larger than any on our current system adopt the new platform.</p></div></div>
        <div class="card"><h3>Competitor benchmarking</h3><div data-k="d6"><p>I compare competing DMS accounting modules and modern cloud accounting tools on workflow, speed and setup effort, and use AI tools to speed up the research.</p><p><b>Insight that changed a decision:</b> competitors showed factory financial statements on screen with live drill-down. We offered an Excel download, which cost users time and limited how far they could drill into the numbers. That made on-screen financial visualization with drill-down a priority for the new system.</p></div></div>
        <div class="card"><h3>MVP validation</h3><div data-k="d7"><p>New applications go to pilot dealerships first. The accounting rebuild was piloted by <b>4 dealer groups</b>, and I used their feedback to decide what shipped wider and what changed first.</p><p>One pilot controller told us the new A/P batch payment workflow was "awful" and she would not use it. That led to discovery on a full redesign, which cut the process from 10+ minutes to under a minute. See <a href="#case-ap">the A/P batch case study</a>.</p></div></div>
      </div>
      <div class="card">
        <div class="eyebrow">Cross-functional collaboration</div>
        <h3>Bringing the right people in at the right step</h3>
        <div class="prose" data-k="d8"><p>I map discovery so each partner knows exactly when they're needed. Product Management drives every step. The engineering lead, architect and design partner each have defined touchpoints: some steps they just read, some they weigh in on in a short session or review, and some they own and sign off.</p><p>Two hard checkpoints, the Problem Brief and the Solution Direction Brief, bring everyone together before we move from understanding the problem to shaping and specifying the solution. When the problem is already clear, a fast-track path skips the deep dive.</p></div>
        <div class="gallery shots" data-gallery="collab" data-add="Replace collaboration map"></div>
      </div>

<section class="band" id="execution">

      <h2>Turning strategy into shipped software</h2>

    <div class="stack-lg">
      <div class="grid">
        <div class="card"><h3>Product Requirements Document (PRD)</h3><div data-k="x1"><p>Problem, goals, users, scope, requirements, success metrics and open questions for each epic.</p></div></div>
        <div class="card"><h3>Business Requirements Document (BRD)</h3><div data-k="x2"><p>Business case and outcomes leadership signs off on, including OEM and compliance needs.</p></div></div>
        <div class="card"><h3>Functional specifications</h3><div data-k="x3"><p>Field-level rules, calculations, posting logic and edge cases. Accounting needs to be exact.</p></div></div>
        <div class="card"><h3>User stories &amp; acceptance criteria</h3><div data-k="x4"><p>Small, testable stories with Given/When/Then criteria the team and QA can agree on.</p></div></div>
        <div class="card"><h3>User flows &amp; wireframes</h3><div data-k="x5"><p>Built with UX using input from engineering, architects, data teams, client-facing teams and OEMs.</p></div></div>
        <div class="card"><h3>Sprint planning</h3><div data-k="x6"><p>Set priorities for 2 teams of 40+ engineers. Clear goals and quick decisions kept us about 20% above planned velocity on average.</p></div></div>
        <div class="card"><h3>Backlog management</h3><div data-k="x7"><p>Ordered by pilot dates, user impact and dependencies. Groomed weekly at the detail level with developers.</p></div></div>
        <div class="card"><h3>UAT &amp; release planning</h3><div data-k="x8"><p>Run UAT on every story and defect as it's completed, and release nothing to pilot until it passes. Weekly releases, with technical and non-technical release notes.</p></div></div>

        <h3 style="margin-bottom:12px">User flow: paying vendors <span class="tag ill">Illustrative</span></h3>
        <ol class="flow" data-k="flow"><li><span>Select open invoices</span></li><li><span>Review &amp; approve</span></li><li><span>Print checks</span></li><li><span>Create positive pay file</span></li><li><span>Send to bank</span></li><li><span>Reconcile cleared checks</span></li></ol>
      </div>

      <div>
        <h3 style="margin-bottom:12px">Sample user story <span class="tag pro">Professional</span></h3>
        <div class="story" data-k="story">
          <div class="eyebrow">Feature: Consolidated vendor payables view &#183; from the <a href="#case-ap">A/P batch case study</a></div>
          <p><b>As a</b> dealership controller, <b>I want to</b> pay selected vendors, or all vendors, directly from the open payables list, <b>so that</b> I can complete a batch payment without leaving the screen.</p>
          <div class="gwt">
            <b>GIVEN</b><span>I've selected one or more vendors with invoices marked "Include in payment"</span>
            <b>WHEN</b><span>I choose Pay Selected Vendors</span>
            <b>THEN</b><span>payments are created for only the included invoices of the selected vendors</span>
            <b>AND</b><span>vendors set to "one payment per invoice" get a separate payment for each invoice, and vendors set to "one payment for all invoices" get a single payment</span>
            <b>AND</b><span>the payment method override is used when set; otherwise the vendor's primary payment method is used</span>
            <b>AND</b><span>if any selected vendor has no payment method, nothing is paid and an error tells me to set one</span>
            <b>AND</b><span>if no vendors are selected, an error asks me to select at least one vendor</span>
            <b>AND</b><span>Pay All Vendors applies the same rules to every vendor in the current filtered list</span>
          </div>
        </div>
      </div>

<!-- ================= CASE: REBUILD ================= -->
<div data-view="case-rebuild" hidden>
  <section class="case-hero">
    <div class="wrap">
      <a class="back" href="#work">&#8592; All case studies</a>
      <div class="stack">
        <div><span class="tag pro">Professional &#183; anonymized</span></div>
        <h1 data-k="r-title">Rebuilding a legacy dealership accounting system from the ground up</h1>
        <p class="lede" data-k="r-lede">How I led discovery, prioritization and delivery for a modern replacement of the accounting product dealerships use every day, and shipped 20+ applications on fixed pilot dates.</p>
      </div>
      <div class="meta">
        <div><div class="eyebrow">Role</div><div data-k="r-m1">Product Owner &amp; Creator</div></div>
        <div><div class="eyebrow">Pilots</div><div data-k="r-m2">4 dealer groups</div></div>
        <div><div class="eyebrow">Team</div><div data-k="r-m3">2 dev teams (40+ engineers), UX, architects, data</div></div>
        <div><div class="eyebrow">Scope</div><div data-k="r-m4">20+ accounting applications</div></div>
      </div>
      <div class="tldr">
        <div class="card"><div class="eyebrow">Problem</div><div data-k="r-t1"><p>A 30-year-old accounting system, written in an outdated language with a dated UI, couldn't scale to large dealer groups. The business couldn't sell to groups with 30+ rooftops.</p></div></div>
        <div class="card"><div class="eyebrow">What I did</div><div data-k="r-t2"><p>Ran user discovery, set the backlog around user expectations, aligned engineering, UX, data, OEMs and client teams, and directed 2 teams' sprints.</p></div></div>
        <div class="card"><div class="eyebrow">Outcome</div><div data-k="r-t3"><p>20+ applications delivered for pilot with 4 dealer groups, with high client satisfaction. Users saw their data faster with less toggling between screens. Ranked top-performing in the department.</p></div></div>
      </div>
    </div>
  </section>
  <div class="wrap case-body">
    <nav class="toc" aria-label="Case study sections">
      <a href="#r1">Problem</a><a href="#r2">Business context</a><a href="#r3">Users &amp; personas</a><a href="#r4">Pain points</a><a href="#r5">Market research</a><a href="#r6">Solution &amp; decisions</a><a href="#r7">Requirements</a><a href="#r8">Wireframes</a><a href="#r9">Implementation</a><a href="#r10">Results &amp; learnings</a>
    </nav>
    <article>
      <section class="cs-sec" id="r1"><div class="eyebrow">Problem statement</div><h2>An accounting system that couldn't keep up</h2>
        <div class="prose" data-k="r1"><p>Dealerships ran their books on an accounting system that had grown over 30 years. It was written in an outdated language that could not support a modern, complex UI, and the screens users worked in every day showed their age.</p><p>The bigger business problem was scale. The system was not a good framework for large dealer groups, so we could not market to groups with 30 or more rooftops at all.</p><p><b>Problem statement:</b> Dealership accounting teams need accurate, fast workflows to post, pay, reconcile and report every month. The legacy system's outdated architecture and UI made information slow to reach and kept the business out of the large dealer group market.</p></div>
      </section>
      <section class="cs-sec" id="r2"><div class="eyebrow">Business context</div><h2>Why now</h2>
        <div class="prose" data-k="r2"><ul><li><b>Open a new market:</b> large dealer groups with 30+ rooftops that the legacy system could not serve.</li><li><b>Win over hesitant dealers:</b> address the reservations of dealers who chose other systems, largely because competitors offered a better user interface.</li><li><b>Fixed pilot go-live dates,</b> so every sprint had to count.</li><li><b>OEM compliance</b> for factory financial reporting was non-negotiable.</li></ul></div>
      </section>
      <section class="cs-sec" id="r3"><div class="eyebrow">Target audience &amp; personas</div><h2>Who uses dealership accounting</h2>
        <p class="muted" data-k="r3-note">Composite personas drawn from years of supporting these users and from discovery for this project.</p>
        <div class="grid" data-k="r3">
          <div class="card"><h3>The Controller</h3><p><b>Goal:</b> close the month accurately and on time; produce OEM statements.</p><p><b>Frustration:</b> hours spent tracking down why schedules don't tie to the GL.</p></div>
          <div class="card"><h3>The AP / Office Clerk</h3><p><b>Goal:</b> enter invoices and pay vendors quickly without mistakes.</p><p><b>Frustration:</b> repetitive entry and fragile check and bank file setup.</p></div>
          <div class="card"><h3>The Cashier</h3><p><b>Goal:</b> take payments fast while a customer waits.</p><p><b>Frustration:</b> too many screens for a simple transaction.</p></div>
          <div class="card"><h3>Dealer group CFO &amp; OEMs</h3><p><b>Goal:</b> reliable, comparable financials across rooftops; statements that meet factory rules.</p><p><b>Frustration:</b> late or inconsistent reporting.</p></div>
        </div>
      </section>
      <section class="cs-sec" id="r4"><div class="eyebrow">User pain points</div><h2>What hurt most</h2>
        <div class="prose" data-k="r4"><ol><li><b>Couldn't scale to large dealer groups.</b> The framework wasn't built for 30+ rooftop organizations.</li><li><b>Information spread across multiple screens.</b> Users toggled between screens to find the data they needed.</li><li><b>Dated UI</b> next to competitors with more modern interfaces.</li><li><b>Reconciliation breaks</b> between subledgers and the GL, the top call driver I saw in support for years.</li><li><b>Check printing and positive pay setup</b> that broke easily.</li><li><b>OEM reporting</b> that needed constant reprogramming.</li></ol></div>
      </section>
      <section class="cs-sec" id="r5"><div class="eyebrow">Market &amp; competitor research</div><h2>What others do well, and where they fall short</h2>
        <div class="tbl" data-k="r5"><table><thead><tr><th>Benchmark</th><th>Strengths</th><th>Gaps</th><th>What we took</th></tr></thead><tbody>
          <tr><td>Competing DMS accounting modules</td><td>More modern user interfaces, including on-screen factory financials with live drill-down; a key reason some dealers chose them</td><td>Users still expect speed and accuracy over polish</td><td>Modern UI patterns, updated feature by feature as we built</td></tr>
          <tr><td>Modern cloud accounting tools</td><td>Clean, fast entry screens; good defaults</td><td>Not built for dealership or OEM accounting</td><td>UX patterns for entry and search</td></tr>
          <tr><td>Our legacy system</td><td>Deep dealership functionality users trust and know</td><td>Outdated language and UI; can't scale to large groups</td><td>Functional parity and familiar workflows as the baseline</td></tr>
        </tbody></table></div>
        <p class="tbl-note" data-k="r5-note">I used AI tools to speed up market research and summarize competitor documentation.</p>
      </section>
      <section class="cs-sec" id="r6"><div class="eyebrow">Proposed solution</div><h2>A modular, modern accounting suite</h2>
        <div class="prose" data-k="r6"><p>Rebuild accounting as a set of focused applications that share one ledger. Each one keeps what accountants rely on, fixes their top pain points, and can ship on its own to meet pilot dates.</p></div>
        <div class="tbl" data-k="r6-opts"><table><thead><tr><th>Option</th><th>Pros</th><th>Cons</th><th>Decision</th></tr></thead><tbody>
          <tr><td>Refactor the legacy system in place</td><td>Lower short-term risk</td><td>Kept UX and architecture limits</td><td>Rejected</td></tr>
          <tr><td>Lift and shift to new infrastructure</td><td>Faster</td><td>Carried old debt forward</td><td>Rejected</td></tr>
          <tr><td><b>Ground-up modular rebuild</b></td><td>Modern UX; ship by application; opens new markets</td><td>Must reach parity on a fixed date</td><td><b>Chosen</b></td></tr>
        </tbody></table></div>
        <div class="decision" data-k="r6-dec"><div class="eyebrow">Key decision</div><p><b>Build the foundation first, then everything that posts to it.</b> I started with the accounting base and security settings, then the chart of accounts setup, and only then built the applications that flow into the general ledger, such as transaction entry, payables, check writing, receivables and cashiering.</p><p>Every application posts to the GL. Getting the ledger structure and permissions right first meant each later application could be built and tested against a stable base, without rework.</p></div>
      </section>
      <section class="cs-sec" id="r7"><div class="eyebrow">Product requirements</div><h2>What we committed to</h2>
        <div class="prose" data-k="r7"><p><b>Applications in scope:</b> check writing, positive pay, transaction entry, payables, receivables, cashiering, financial reporting, account setup, account schedules, AR statements, journal type setup, unit count setup, payment method setup, sales tax report, reconciliation flag setup and reports, receive payment, open/close accounting month setup, GL line sequencing, voiding, and tax exemptions.</p><p><b>Non-functional:</b> accurate to the penny, full audit trail, role-based permissions, and every page loads in under 3 seconds.</p><p><b>Compliance:</b> OEM factory statement requirements delivered with each release.</p><p>See a <a href="#execution">sample user story with acceptance criteria</a>.</p></div>
      </section>
      <section class="cs-sec" id="r8"><div class="eyebrow">Wireframes &amp; prototypes</div><h2>Shaping the screens</h2>
        <div class="prose" data-k="r8"><p>I gathered requirements from engineering, UX, architects, data teams, client-facing teams and OEMs, then used their input to shape screen layouts and the build plan. This meant fewer rework cycles and faster approvals.</p></div>
        <div><div class="gal-label">Wireframes / screenshots (sanitize customer data)</div><div class="gallery" data-gallery="r-wire" data-add="Add a wireframe or screenshot"></div></div>
      </section>
      <section class="cs-sec" id="r9"><div class="eyebrow">Implementation approach</div><h2>Delivering with two teams on fixed dates</h2>
        <div class="prose" data-k="r9"><ul><li>Directed priorities and sprint planning for 2 teams of 40+ engineers.</li><li>Wrote detailed epics, features and stories for every release, and groomed with developers at the detail level.</li><li>Made quick decisions so teams were never blocked, keeping velocity about 20% above plan on average.</li><li>Sequenced work by pilot go-live dates and dependencies.</li><li>Ran two-week sprints with weekly releases to pilot.</li><li>Ran UAT on every story and defect as soon as it was completed. Nothing finished in a sprint went to pilot until it passed UAT.</li><li>Piloted with 4 dealer groups, one at a time.</li></ul></div>
      </section>
      <section class="cs-sec" id="r10"><div class="eyebrow">Results &amp; learnings</div><h2>What happened</h2>
        <div class="prose" data-k="r10"><ul><li><b>20+ accounting applications</b> delivered for pilot with 4 dealer groups.</li><li>Ranked <b>top-performing in the department</b> for quality, volume and value delivered.</li><li><b>High client satisfaction</b> in pilot. Dealers saw their data faster and no longer searched across multiple screens for information.</li><li><b>Fewer rework cycles and faster approvals</b> from early cross-functional alignment.</li><li><b>OEM requirements delivered.</b></li></ul>
        <h3 style="margin-top:12px">What I learned about what users value</h3><ol><li><b>Data comes first.</b> If the data isn't accurate, it doesn't matter how good the UI looks.</li><li><b>Speed wins over features.</b> Any slowdown in a workflow gets rejected, even if the new screen shows more information. Dealerships prefer fast workflows over fancy new tools.</li><li><b>Familiarity builds trust.</b> Drastic changes push users away, however good they are. When a big change is needed, incremental steps in the right direction work best. "Don't move the cheese."</li></ol>
        <h3 style="margin-top:12px">What I would do differently</h3><p><b>Prioritize readiness over dates.</b> Pressure to hit pilot dates meant some pieces went to pilot before they were ready. The sprints that followed were defect-heavy and built a backlog we would not have had otherwise. Next time I would hold the line on functionality and push back on a date when I know the product isn't ready.</p></div>
      </section>
    </article>
  </div>
</div>

<!-- ================= CASE: PIVOT ================= -->
<div data-view="case-pivot" hidden>
  <section class="case-hero">
    <div class="wrap">
      <a class="back" href="#work">&larr; All case studies</a>
      <div class="stack">
        <div><span class="tag pro">Professional &middot; anonymized</span></div>
        <h1 data-k="p-title">Changing course: redirecting a project before it missed its goal</h1>
        <p class="lede" data-k="p-lede">Leadership planned to require a universal ledger for mapping every dealer's OEM financial statements on the new platform. From years inside the system, I could see it would break data conversion, limit which clients we could serve, and push costs onto engineering and support. I put the evidence in writing and leadership changed course.</p>
      </div>
      <div class="meta">
        <div><div class="eyebrow">Role</div><div data-k="p-m1">Product Owner &amp; Creator</div></div>
        <div><div class="eyebrow">Result</div><div data-k="p-m2">Universal ledger dropped</div></div>
        <div><div class="eyebrow">Stakeholders</div><div data-k="p-m3">Product leadership, engineering, architects, onboarding, support</div></div>
        <div><div class="eyebrow">Skill shown</div><div data-k="p-m4">Influence without authority</div></div>
      </div>
      <div class="tldr">
        <div class="card"><div class="eyebrow">Situation</div><div data-k="p-t1"><p>The plan routed financial statement amounts through a universal ledger using metadata that doesn't exist in the legacy system, and would apply to all dealers.</p></div></div>
        <div class="card"><div class="eyebrow">What I did</div><div data-k="p-t2"><p>Analyzed the impact across onboarding, yearly OEM changes, dealer differences, support cost and development time, and wrote it up as a pros and cons analysis for leadership.</p></div></div>
        <div class="card"><div class="eyebrow">Outcome</div><div data-k="p-t3"><p>Leadership dropped the universal ledger. Piloting got faster, conversion and onboarding training got lighter, and year-end changes fell by 50%.</p></div></div>
      </div>
    </div>
  </section>
  <div class="wrap case-body">
    <nav class="toc" aria-label="Case study sections">
      <a href="#p1">Problem</a><a href="#p2">Business context</a><a href="#p3">Stakeholders</a><a href="#p4">Where it breaks</a><a href="#p5">Evidence</a><a href="#p6">Options</a><a href="#p7">Requirements</a><a href="#p8">The analysis</a><a href="#p9">How I influenced</a><a href="#p10">Results &amp; learnings</a>
    </nav>
    <article>
      <section class="cs-sec" id="p1"><div class="eyebrow">Problem statement</div><h2>A one-size-fits-all ledger for dealers who aren't the same</h2>
        <div class="prose" data-k="p1"><p>The new platform needed a way to produce each dealer's OEM factory financial statement. The proposed approach was a universal ledger: map every dealer's amounts to the statement using metadata, and require it for all users.</p><p>The problem was that the metadata didn't exist in the legacy system that dealers were converting from. Someone would have to create it by hand for every store, and one missed entry would throw off the balances. Dealers on the same OEM also don't route their financials the same way, so a forced standard would produce statements that didn't match what they had been submitting.</p><p><b>Problem statement:</b> Dealers moving to the new platform need OEM financial statements that match their own chart of accounts from day one, but a forced universal ledger would make conversion error-prone, slow onboarding, and cap the size of clients we could support.</p></div>
      </section>
      <section class="cs-sec" id="p2"><div class="eyebrow">Business context</div><h2>What was at stake</h2>
        <div class="prose" data-k="p2"><ul><li>Every dealer converting from the legacy system (about 4,700 dealerships) would go through this mapping.</li><li>OEMs check every statement. Inconsistencies trigger errors and can cost dealers points with their manufacturer.</li><li>OEMs change statements every year, sometimes mid-year.</li><li>Onboarding speed and accuracy directly affect pilot success and the platform's ability to grow.</li></ul></div>
      </section>
      <section class="cs-sec" id="p3"><div class="eyebrow">Target audience &amp; stakeholders</div><h2>Who was affected</h2>
        <div class="prose" data-k="p3"><ul><li><b>Product leadership:</b> owned the decision.</li><li><b>Engineering &amp; architects:</b> would build, maintain and update the mapping every year.</li><li><b>Onboarding / conversion team:</b> would have to create missing metadata for every store.</li><li><b>Support:</b> would field every routing change.</li><li><b>Dealership controllers:</b> submit statements to their OEM every month.</li><li><b>OEMs:</b> receive and score the statements.</li></ul></div>
      </section>
      <section class="cs-sec" id="p4"><div class="eyebrow">Pain points</div><h2>Where the original plan would break</h2>
        <div class="prose" data-k="p4"><ol><li><b>Onboarding and data conversion.</b> Amounts were routed by metadata that doesn't exist in the legacy system, so the team would have to build it for every store. Missing a single entry throws off balances. The work also needs deep accounting knowledge that most engineers don't have.</li><li><b>A hard ceiling on growth.</b> The metadata had to be entered as beginning balance memos, which the platform limits to 700. Larger OEMs and clients with more than 700 accounts could not be supported at all.</li><li><b>Yearly OEM changes.</b> Every annual or mid-year statement change would need development resources to update and re-route.</li><li><b>Dealers aren't identical.</b> Two dealers on the same OEM have different charts of accounts. Forcing one mapping would create mismatches with what they previously submitted. Because some OEMs calculate month-to-date as this month's year-to-date minus last month's, a mid-year change would cause errors and point deductions.</li><li><b>Support cost.</b> Dealers would need to call support for any routing change.</li><li><b>Development time.</b> Financial statement development would take at least twice as long as routing from the operational GL.</li></ol></div>
      </section>
      <section class="cs-sec" id="p5"><div class="eyebrow">Research &amp; evidence</div><h2>Building the case</h2>
        <div class="prose" data-k="p5"><p>I combined years of hands-on knowledge of how dealership accounting and OEM statements work with data on what the plan would cost:</p><ul><li><b>Support cost model:</b> about 4,700 legacy dealers at an average of $40 per support call. If each dealer called just once a year about routing, that's roughly $188K a year in new support cost.</li><li><b>Onboarding effort:</b> creating enough data just to certify one test store took about a full sprint. Live dealerships would take longer.</li><li><b>Platform limits:</b> the 700 beginning-balance memo cap ruled out larger OEMs and clients.</li><li><b>Staffing:</b> every onboarding would need scarce, higher-cost engineers with accounting expertise.</li></ul><p>I wrote this up as a pros and cons analysis organized by onboarding, yearly changes, personalization, support cost and development time, so leadership could weigh it quickly.</p></div>
      </section>
      <section class="cs-sec" id="p6"><div class="eyebrow">Proposed solution</div><h2>Universal ledger vs. routing from each dealer's GL</h2>
        <div class="prose" data-k="p6-intro"><p>My recommendation: route OEM statements from each dealer's operational general ledger, and copy their existing routing and mapping from the legacy system during conversion.</p></div>
        <div class="tbl" data-k="p6"><table><thead><tr><th>Criteria</th><th>Universal ledger for all</th><th>Route from dealer's own GL</th></tr></thead><tbody>
          <tr><td>Data conversion</td><td>Metadata created by hand for every store; one miss breaks balances</td><td>Existing routing copied from the legacy store</td></tr>
          <tr><td>Beginning balances</td><td>Entered manually as memos</td><td>No manual entry needed</td></tr>
          <tr><td>Scalability</td><td>700-account cap blocks larger OEMs and clients</td><td>No cap</td></tr>
          <tr><td>Fit with each dealer</td><td>Forced standard; mismatches with prior OEM submissions</td><td>Each dealer keeps its own routing</td></tr>
          <tr><td>Yearly OEM changes</td><td>Development work every year</td><td>Handled in routing setup</td></tr>
          <tr><td>Support cost</td><td>Up to ~$188K/yr in routing calls</td><td>No new call driver</td></tr>
          <tr><td>Development time</td><td>At least 2&times; longer</td><td>Saves sprints of schedule building</td></tr>
        </tbody></table></div>
      </section>
      <section class="cs-sec" id="p7"><div class="eyebrow">Product requirements</div><h2>What changed in scope</h2>
        <div class="prose" data-k="p7"><ul><li>OEM financial statements route from the dealer's operational GL.</li><li>Conversion copies each store's existing routing and mapping from the legacy system.</li><li>No manual beginning balance metadata during onboarding.</li><li>The universal ledger was dropped entirely.</li></ul></div>
      </section>
      <section class="cs-sec" id="p8"><div class="eyebrow">Supporting analysis</div><h2>The write-up I shared with leadership</h2>
        <div class="prose" data-k="p8"><p>I organized my findings into a short pros and cons analysis, grouped by the areas leadership cared about:</p><ul><li><b>Onboarding:</b> missing metadata, manual beginning balances, the 700-memo limit, and the accounting expertise required.</li><li><b>Yearly changes:</b> development effort for every annual and mid-year OEM update.</li><li><b>Personalization:</b> why two dealers on the same OEM can't share one mapping.</li><li><b>Cost of support:</b> the projected call volume and dollar cost.</li><li><b>Time of development:</b> 2&times; longer statement development and about a sprint to certify a single test store.</li></ul></div>
      </section>
      <section class="cs-sec" id="p9"><div class="eyebrow">Implementation approach</div><h2>How I influenced the decision</h2>
        <div class="prose" data-k="p9"><ol><li>Started from leadership's goal: a reliable way to produce OEM statements on the new platform.</li><li>Tested the plan against how dealers' data actually exists in the legacy system.</li><li>Quantified the gap in support dollars, sprints and platform limits, beyond technical risk alone.</li><li>Wrote it up in a structured pros and cons analysis leadership could act on.</li><li>Proposed an alternative that met the same goal with less cost and risk.</li></ol></div>
      </section>
      <section class="cs-sec" id="p10"><div class="eyebrow">Results &amp; learnings</div><h2>What changed</h2>
        <div class="prose" data-k="p10"><ul><li><b>Leadership changed direction</b> before the universal ledger was forced on all users.</li><li><b>Avoided significant cost</b> in development, data conversion, training and support, including up to ~$188K a year in projected support calls.</li><li>Removed a <b>700-account ceiling</b> that would have blocked larger OEMs and clients.</li><li>Protected <b>customer satisfaction</b> by keeping statements consistent with what dealers already submit to their OEMs.</li><li><b>Faster piloting</b> and <b>less intensive data conversion</b>, since existing routing carried over from the legacy system.</li><li><b>Less customer training</b> during onboarding, and <b>more familiarity</b> for clients, who kept the statement setup they already knew.</li><li><b>50% fewer year-end changes</b> needed for OEM statement updates.</li></ul>
        <h3 style="margin-top:12px">What I learned</h3><ul><li>Put the cost in business terms. Dollars and sprints moved the decision more than technical objections would have.</li><li>Write it down. A clear, structured document gave leadership something concrete to decide on.</li><li>Deep domain knowledge is a product skill: knowing where the data really lives exposed the risk early.</li></ul></div>
      </section>
    </article>
  </div>
</div>
<!-- ================= CASE: AP BATCH ================= -->
<div data-view="case-ap" hidden>
  <section class="case-hero">
    <div class="wrap">
      <a class="back" href="#work">&larr; All case studies</a>
      <div class="stack">
        <div><span class="tag pro">Professional &middot; anonymized</span></div>
        <h1 data-k="a-title">From 10 minutes to under one: redesigning A/P batch payments</h1>
        <p class="lede" data-k="a-lede">During pilot, a dealership controller called our new batch payment workflow "awful" and said she would not use it. I took that as a discovery signal, compared three ways to fix it, and led a ground-up rebuild that turned a 10+ minute process into one that takes less than a minute.</p>
      </div>
      <div class="meta">
        <div><div class="eyebrow">Role</div><div data-k="a-m1">Product Owner &amp; Creator</div></div>
        <div><div class="eyebrow">Timeline</div><div data-k="a-m2">~10 weeks</div></div>
        <div><div class="eyebrow">Team</div><div data-k="a-m3">UX designer, developers, QA</div></div>
        <div><div class="eyebrow">Scope</div><div data-k="a-m4">1 feature, 13 user stories, 56 points</div></div>
      </div>
      <div class="tldr">
        <div class="card"><div class="eyebrow">Problem</div><div data-k="a-t1"><p>Paying vendors in a batch took 10+ minutes across multiple screens, with no summary of what was owed to whom. A pilot controller refused to use it.</p></div></div>
        <div class="card"><div class="eyebrow">What I did</div><div data-k="a-t2"><p>Ran discovery with pilot users, partnered with engineering and UX on a design spike, wrote the feature and its stories, and led delivery to release.</p></div></div>
        <div class="card"><div class="eyebrow">Outcome</div><div data-k="a-t3"><p>One screen to review, select and pay every vendor. A batch payment now takes under a minute, and the adoption blocker is gone.</p></div></div>
      </div>
    </div>
  </section>
  <div class="wrap case-body">
    <nav class="toc" aria-label="Case study sections">
      <a href="#a1">Problem</a><a href="#a2">Business context</a><a href="#a3">Users</a><a href="#a4">Pain points</a><a href="#a5">Research</a><a href="#a6">Options &amp; decision</a><a href="#a7">Requirements</a><a href="#a8">Design</a><a href="#a9">Implementation</a><a href="#a10">Results &amp; learnings</a>
    </nav>
    <article>
      <section class="cs-sec" id="a1"><div class="eyebrow">Problem statement</div><h2>A routine task that users refused to do</h2>
        <div class="prose" data-k="a1"><p>Paying vendors is one of the most frequent jobs in dealership accounting. On the new platform, the batch payment workflow made controllers move through several screens and navigation steps just to see what they owed and to whom. A single batch took more than 10 minutes.</p><p>In pilot user research, a controller described the experience as "awful" and said she would not use it in its current form.</p><p><b>Problem statement:</b> Dealership controllers need to see all open payables by vendor and pay them quickly, but the current workflow has no vendor summary and spreads one task across multiple screens, creating a direct adoption risk for the new platform.</p></div>
      </section>
      <section class="cs-sec" id="a2"><div class="eyebrow">Business context</div><h2>Why it mattered</h2>
        <div class="prose" data-k="a2"><ul><li><b>Adoption risk:</b> a pilot user rejecting a core workflow threatens the whole platform rollout.</li><li><b>High frequency:</b> controllers and accounting offices pay vendors constantly, so every extra minute multiplies.</li><li><b>Competitive expectations:</b> competing DMS platforms had set a higher bar for this experience.</li><li><b>Training cost:</b> a confusing multi-screen process adds onboarding and support effort.</li></ul></div>
      </section>
      <section class="cs-sec" id="a3"><div class="eyebrow">Target audience &amp; personas</div><h2>Who pays the vendors</h2>
        <div class="grid" data-k="a3">
          <div class="card"><h3>The Controller</h3><p><b>Goal:</b> see what's owed, choose what to pay, and pay it in one sitting.</p><p><b>Frustration:</b> clicking through screens to build a batch; no single view of vendor balances.</p></div>
          <div class="card"><h3>The Accounting Office</h3><p><b>Goal:</b> process vendor payments accurately in each vendor's preferred way (check, one payment per invoice or one per vendor).</p><p><b>Frustration:</b> starting over when a vendor needs to come out of a batch.</p></div>
        </div>
      </section>
      <section class="cs-sec" id="a4"><div class="eyebrow">User pain points</div><h2>What made it slow</h2>
        <div class="prose" data-k="a4"><ol><li><b>No summary by vendor.</b> Users couldn't see vendor totals or past-due amounts in one place.</li><li><b>Too many screens and clicks</b> for a routine task.</li><li><b>Rigid batches.</b> Deselecting a vendor removed its invoices from the batch entirely. Paying that vendor later meant creating a brand-new batch.</li><li><b>Time:</b> 10+ minutes for a single batch payment.</li></ol></div>
      </section>
      <section class="cs-sec" id="a5"><div class="eyebrow">Market &amp; competitor research</div><h2>What users already knew, and what competitors offered</h2>
        <div class="prose" data-k="a5"><ul><li><b>The legacy workflow users trusted:</b> pick vendor types (or all), see a list of vendors with open balances, then choose an action per vendor. Pilot users wanted that familiar flow back.</li><li><b>Competing DMS platforms</b> offered a consolidated vendor view, which set the UX expectation.</li><li><b>Platform options:</b> the base platform had related open payables logic we could learn from instead of starting from zero.</li></ul></div>
      </section>
      <section class="cs-sec" id="a6"><div class="eyebrow">Proposed solution</div><h2>Three options, one clear winner</h2>
        <div class="prose" data-k="a6-intro"><p>I worked through a design spike with engineering to compare three approaches.</p></div>
        <div class="tbl" data-k="a6"><table><thead><tr><th>Option</th><th>How it works</th><th>Trade-offs</th><th>Decision</th></tr></thead><tbody>
          <tr><td>1. Modify the existing payment batch app</td><td>Add a vendor summary to the batch and keep deselected invoices in it</td><td>Very invasive to a core app; still not the simple "just pay" experience users asked for</td><td>Rejected</td></tr>
          <tr><td>2. Choose invoices when creating the batch</td><td>Pick vendors and invoices up front, then build the batch</td><td>Moves the complexity to batch creation; risky performance for stores with thousands of invoices</td><td>Rejected</td></tr>
          <tr><td><b>3. New Open Payables application</b></td><td>A live list of every vendor and amount owed, with drill-in and one-click pay</td><td>The list changes as new invoices are entered</td><td><b>Chosen</b></td></tr>
        </tbody></table></div>
        <div class="decision" data-k="a6-dec"><div class="eyebrow">Key decision</div><p><b>Build new instead of bending the old app.</b> Option 3 was the fastest to deliver and the closest to what users needed. Its one downside was that the list updates live as invoices come in, unlike a fixed batch. I checked that trade-off with a pilot controller, who confirmed it was acceptable and matched how they were used to working.</p></div>
      </section>
      <section class="cs-sec" id="a7"><div class="eyebrow">Product requirements</div><h2>What the feature had to do</h2>
        <div class="prose" data-k="a7"><ul><li>One list of open payables grouped by vendor: vendor number, name and class, amount to pay, past-due amount, total due, discount, and payment method.</li><li>Drill into any vendor to see its open invoices and include or exclude each one, with select all.</li><li>Totals update automatically when the user returns from the invoice view.</li><li>Pay selected vendors, or pay all vendors, from the same screen.</li><li>Respect each vendor's preference for one payment per invoice or one payment for all invoices.</li><li>Allow a payment method override, and block payment if no method is set.</li><li>Flag any payment that errors, show the error details, and surface errors on the controller's payables dashboard.</li><li>Change the vendor on an open invoice directly from the list.</li></ul></div>
        <div class="story" data-k="a7-ac">
          <div class="eyebrow">Acceptance criteria (excerpt)</div>
          <div class="gwt">
            <b>GIVEN</b><span>a controller opens the batch payment screen</span>
            <b>THEN</b><span>all open payables show, grouped by vendor, with total due, past-due amount and vendor type</span>
            <b>WHEN</b><span>the controller selects or deselects invoices for a vendor</span>
            <b>THEN</b><span>only selected invoices count toward the payment, and the totals update</span>
            <b>WHEN</b><span>the controller starts the payment</span>
            <b>THEN</b><span>it completes without leaving the screen, and paid invoices drop off the list</span>
          </div>
        </div>
      </section>
      <section class="cs-sec" id="a8"><div class="eyebrow">Wireframes &amp; prototypes</div><h2>Designing a single-screen flow</h2>
        <div class="prose" data-k="a8"><p>I worked with UX on designs in Figma. The spike compared two layouts: summary and detail tables on the same screen, or a summary list with a drill-in view for each vendor's invoices. We chose the drill-in view, which kept the main list clean and fast.</p></div>
        <div><div class="gal-label">Screenshots from testing</div><div class="gallery shots" data-gallery="a-wire" data-add="Add a design or screenshot"></div></div>
      </section>
      <section class="cs-sec" id="a9"><div class="eyebrow">Implementation approach</div><h2>From spike to release in about 10 weeks</h2>
        <div class="prose" data-k="a9"><p>I split the feature into 13 stories (56 points) and sequenced them so each one built on the last:</p></div>
        <ol class="flow" data-k="a9-flow"><li><span>Design spike</span></li><li><span>Security &amp; data table</span></li><li><span>Vendor totals logic</span></li><li><span>Live update triggers</span></li><li><span>Vendor summary screen</span></li><li><span>Invoice drill-in</span></li><li><span>Payment creation</span></li><li><span>Error handling &amp; dashboard</span></li></ol>
        <div class="prose" data-k="a9-more"><ul><li><b>Cut scope when a better way appeared.</b> We planned a "Refresh totals" button, then found the screen could refresh itself when the user returns from the invoice view. I closed that story and the experience got simpler.</li><li><b>Tested the edge cases that matter in accounting:</b> paying a single vendor with one payment per invoice, paying all vendors with mixed payment preferences and methods, no vendors selected, and a missing payment method.</li><li>The work took about 10 weeks, and all 13 stories were accepted.</li></ul></div>
      </section>
      <section class="cs-sec" id="a10"><div class="eyebrow">Results &amp; learnings</div><h2>What happened</h2>
        <div class="prose" data-k="a10"><ul><li><b>10+ minutes to under 1 minute</b> for a batch payment, when few invoice adjustments are needed.</li><li><b>One screen</b> to review, select and pay every vendor.</li><li><b>Removed an adoption blocker</b> raised by a pilot controller.</li><li>Payments follow each vendor's preference automatically, and errors surface on the controller's dashboard.</li></ul>
        <h3 style="margin-top:12px">What I learned</h3><ul><li><b>Blunt pilot feedback is a gift.</b> "I won't use this" told us more than any metric could, and it pointed straight to the fix.</li><li><b>Don't force a new workflow into an old app.</b> Building new was faster and cleaner than reworking a batch app designed for a different job.</li><li><b>Familiar beats novel.</b> The winning design mirrored the vendor-first flow users already knew, just faster.</li></ul></div>
      </section>

        var rm=document.createElement('button');rm.type='button';rm.textContent='Remove';
        rm.onclick=function(){items.splice(i,1);renderGallery(box);renderGalleries()};
        ctl.appendChild(rm);f.appendChild(ctl);
      }
      box.appendChild(f);
    });
    if(editing&&items.length<max){
      var lab=document.createElement('label');lab.className='add-tile';
      var inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf';inp.hidden=true;
      inp.id='up-'+key;
      lab.appendChild(document.createTextNode('+ '+(box.dataset.add||'Add image')));lab.appendChild(inp);
      inp.onchange=function(){if(inp.files&&inp.files[0])upload(key,inp.files[0],box)};
      box.appendChild(lab);
    }
  }
  async function upload(key,file,box){
    if(!assetsNS){status('Uploads work on the published page when you are signed in as an editor.');return}
    status('Uploading '+file.name+'\u2026');
    try{
      var r=await assetsNS.upload(file);
      (gDraft[key]=gDraft[key]||[]).push({id:r.id,url:r.url,type:r.contentType||file.type,name:file.name,cap:''});
      renderGallery(box);renderGalleries();
      status('Uploaded. Click Save & publish to keep it.');
    }catch(e){status('Upload failed: '+((e&&e.message)||'try a smaller image (under 20 MB).'))}
  }

  /* ---------- routing ---------- */
  function route(){
    var h=(location.hash||'').slice(1);
    var views=$$('[data-view]',app), target=null;
    views.forEach(function(v){if(v.dataset.view===h)target=v});
    if(target){views.forEach(function(v){v.hidden=v!==target});window.scrollTo(0,0);return}
    var inCase=null;
    if(h){var el=document.getElementById(h);if(el){var v=el.closest('[data-view]');if(v&&v.dataset.view!=='home')inCase=v}}
    views.forEach(function(v){v.hidden=inCase?v!==inCase:v.dataset.view!=='home'});
    if(h){var t=document.getElementById(h);if(t)setTimeout(function(){t.scrollIntoView()},0)}
    else window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);

  /* ---------- edit mode ---------- */
  function countTodo(){return $$('[data-view] .todo',app).length}
  function status(msg){var s=$('#editStatus',app);if(!s)return;s.hidden=!msg;s.textContent=msg||''}
  function setEditing(on){
    editing=on;
    document.documentElement.classList.toggle('editing',on);
    app.classList.toggle('editing',on);
    $$('[data-k]',app).forEach(function(el){if(on)el.setAttribute('contenteditable','true');else el.removeAttribute('contenteditable')});
    $('#editBanner',app).hidden=!on;
    $('#btnEdit',app).hidden=on;$('#btnSave',app).hidden=!on;$('#btnCancel',app).hidden=!on;
    if(on){updateBanner()}else status('');
    renderGalleries();
  }
  function updateBanner(){var n=countTodo();$('#editBannerText',app).textContent='Editing. Click any outlined text to change it; use Enter in a list to add a bullet. '+(n?n+' highlighted [placeholders] still need your input.':'No placeholders left.')+' Image slots appear in each section.'}
  function wire(){
    var be=$('#btnEdit',app),bs=$('#btnSave',app),bc=$('#btnCancel',app);
    be.onclick=function(){gDraft=JSON.parse(JSON.stringify(state.g));setEditing(true)};
    bc.onclick=function(){if(busy)return;editing=false;gDraft=null;document.documentElement.classList.remove('editing');mount();showEditor()};
    bs.onclick=save;
    app.addEventListener('click',function(e){if(!editing)return;var a=e.target.closest('a');if(a&&a.closest('[data-k]'))e.preventDefault()});
    app.addEventListener('paste',function(e){
      if(!editing)return;var t=e.target.closest&&e.target.closest('[data-k],figcaption');if(!t)return;
      e.preventDefault();var txt=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText',false,txt);
    });
    app.addEventListener('input',function(){if(editing)updateBanner()});
    var ce=$('#copyEmail',app);
    if(ce)ce.onclick=function(){
      var txt=$('#email',app).textContent;
      var done=function(){ce.textContent='Copied'};
      var fallback=function(){var r=document.createRange();r.selectNodeContents($('#email',app));var s=getSelection();s.removeAllRanges();s.addRange(r);ce.textContent='Selected, press Ctrl+C'};
      try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}
    };
    showEditor();
  }
  function showEditor(){var bar=$('#editbar',app);if(bar)bar.hidden=!artifactNS}

  var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var FONTS='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">';
  function buildDoc(s){
    var json=JSON.stringify(s).replace(/</g,'\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
      '<title>'+document.title.replace(/</g,'&lt;')+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+'\n'+
      '<style id="css">'+document.getElementById('css').textContent+'</style>\n'+
      '<template id="tpl">'+TPL.innerHTML+'</template>\n<div id="app"></div>\n'+
      '<script type="application/json" id="state">'+json+'<\/script>\n'+
      '<script id="appjs">'+document.getElementById('appjs').textContent+'<\/script></body></html>';
  }
  async function save(){
    if(busy)return;busy=true;
    var t={};
    $$('[data-k]',app).forEach(function(el){
      var k=el.dataset.k,h=clean(el.innerHTML);
      if(h!==clean(orig[k]||''))t[k]=h;
    });
    Object.keys(gDraft).forEach(function(k){(gDraft[k]||[]).forEach(function(it){it.cap=(it.cap||'').trim().slice(0,400)})});
    var next={t:t,g:gDraft,saved:new Date().toISOString()};
    status('Publishing\u2026');
    try{
      await artifactNS.publish(buildDoc(next));
      status('Saved. Reloading the latest version\u2026');
    }catch(e){
      var c=e&&e.code;
      if(c==='conflict')status('A newer version was saved elsewhere. The page will reload to it; re-apply your edit if it was lost.');
      else if(c==='not_writer'||c==='not_granted')status('You can view this page but not edit it.');
      else status('Couldn\u2019t publish: '+((e&&e.message)||'unknown error')+'. Your edits are still on screen.');
    }
    busy=false;
  }

  /* ---------- lightbox ---------- */
  function lightbox(src,cap){
    var d=document.createElement('div');d.className='lightbox';d.setAttribute('role','dialog');d.tabIndex=-1;
    var im=document.createElement('img');im.src=src;im.alt=cap||'';d.appendChild(im);
    if(cap){var p=document.createElement('p');p.textContent=cap;d.appendChild(p)}
    var close=function(){d.remove();document.removeEventListener('keydown',k)};
    var k=function(e){if(e.key==='Escape')close()};
    d.onclick=close;document.addEventListener('keydown',k);document.body.appendChild(d);d.focus();
  }

  mount();

  /* ---------- capabilities ---------- */
  (async function(){
    if(!(window.claude&&window.claude.use))return;
    try{
      var res=await Promise.all([window.claude.use('artifact'),window.claude.use('assets'),window.claude.use('user')]);
      var a=res[0],as=res[1],u=res[2];
      var can=false;
      if(u&&u.canEdit){try{can=!!(await u.canEdit())}catch(e){can=false}}
      if(a&&can){artifactNS=a;assetsNS=as||null;showEditor()}
    }catch(e){}
  })();
})();
</script>

</body></html>
